spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/payments/**
            - id: auth-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**
server:
  port: 8080